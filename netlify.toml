[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# The function (netlify/functions/api.cjs) is pre-bundled into one
# self-contained CommonJS file by scripts/build-functions.mjs as part
# of `npm run build`, so Netlify's own bundler has nothing left to
# trace or resolve.

[functions]
  # @libsql/client pulls in ws, which optionally requires these native
  # addons for a perf boost and falls back to pure JS without them.
  # We never install them; tell Netlify's packager not to chase them.
  external_node_modules = ["bufferutil", "utf-8-validate"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
